<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Daily Companion icon: a sprout growing inside a progress ring.
       Pine background, sage track + leaves, gold progress. Everything sits
       inside the 80% "safe zone" so it also works as a maskable icon. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1E4A35"/>
      <stop offset="1" stop-color="#0B1F16"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2CB6B"/>
      <stop offset="1" stop-color="#C9932E"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7FA77F"/>
      <stop offset="1" stop-color="#C4DDBA"/>
    </linearGradient>
    <linearGradient id="leafB" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6E956F"/>
      <stop offset="1" stop-color="#B2CFA9"/>
    </linearGradient>
  </defs>
  <rect id="bgRect" width="1024" height="1024" fill="url(#bg)"/>
  <!-- ring track -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="#9CB89A" stroke-opacity="0.18" stroke-width="58"/>
  <!-- progress arc: 75% of the circle, starting at 12 o'clock -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="url(#gold)" stroke-width="58"
          stroke-linecap="round" stroke-dasharray="1508 2011" transform="rotate(-90 512 512)"/>
  <g transform="translate(512 540) scale(1.22) translate(-512 -540)">
  <!-- soil -->
  <ellipse cx="512" cy="676" rx="118" ry="26" fill="#E0B04F" fill-opacity="0.9"/>
  <!-- stem -->
  <path d="M512 668 C 512 610 506 560 514 486" fill="none" stroke="#9CC495" stroke-width="30" stroke-linecap="round"/>
  <!-- right leaf -->
  <path d="M514 500 C 548 404 616 360 704 352 C 696 444 628 512 514 500 Z" fill="url(#leafA)"/>
  <path d="M530 488 C 580 440 630 400 680 372" fill="none" stroke="#0B1F16" stroke-opacity="0.25" stroke-width="8" stroke-linecap="round"/>
  <!-- left leaf -->
  <path d="M508 574 C 474 494 410 462 330 462 C 344 538 410 584 508 574 Z" fill="url(#leafB)"/>
  <path d="M494 562 C 450 528 400 500 352 480" fill="none" stroke="#0B1F16" stroke-opacity="0.25" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
