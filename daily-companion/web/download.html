<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Install Daily Companion</title>
  <meta name="description" content="Install Daily Companion on your phone — your personal coach and daily companion." />
  <meta name="theme-color" content="#0A1310" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .dl { max-width: 460px; margin: 0 auto; padding: calc(var(--safe-t) + 28px) 18px calc(var(--safe-b) + 32px); }
    .dl .hero-icon { width: 108px; height: 108px; border-radius: 26px; margin: 0 auto 18px; box-shadow: var(--shadow); }
    .dl h1 { font-size: 30px; font-weight: 780; letter-spacing: -0.02em; text-align: center; }
    .dl .lead { text-align: center; color: var(--text-2); margin: 8px 0 24px; }
    .feat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
    .feat div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-size: 14px; color: var(--text-2); }
    .feat b { display: block; color: var(--text); font-size: 15px; margin-bottom: 2px; }
    .platform { display: none; }
    .platform.show { display: block; }
    .langs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 22px; }
    .langs button { border: 0; background: none; color: var(--text-3); font-size: 13px; min-height: 44px; padding: 0 10px; border-radius: 10px; }
    .langs button.on { color: var(--sage); background: var(--sage-dim); }
  </style>
  <script>
    try {
      var th = localStorage.getItem('dc.theme') || 'dark';
      if (th === 'system') th = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = th === 'light' ? 'light' : 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <main class="dl">
    <img class="hero-icon" src="icons/icon-192.png" alt="" width="108" height="108" />
    <h1>Daily Companion</h1>
    <p class="lead" data-i18n="lead"></p>

    <!-- Already installed / opened from the Home Screen -->
    <section class="platform card" id="p-installed">
      <p class="bold" data-i18n="installed"></p>
      <a class="btn primary block mt-12" href="./#/today" data-i18n="open"></a>
    </section>

    <!-- Android & desktop Chrome/Edge: one tap -->
    <section class="platform card" id="p-onetap">
      <button class="btn primary block" id="installBtn" data-i18n="installBtn"></button>
      <p class="faint small center mt-8" data-i18n="installNote"></p>
    </section>

    <!-- iPhone / iPad in Safari -->
    <section class="platform card" id="p-ios">
      <h2 class="bold mb-8" data-i18n="iosTitle"></h2>
      <ol class="steps-list">
        <li><span data-i18n="ios1"></span></li>
        <li><span data-i18n="ios2"></span></li>
        <li><span data-i18n="ios3"></span></li>
      </ol>
      <p class="faint small mt-8" data-i18n="iosNote"></p>
    </section>

    <!-- iPhone in another browser (Chrome, Firefox, …) -->
    <section class="platform card" id="p-ios-other">
      <h2 class="bold mb-8" data-i18n="iosTitle"></h2>
      <p class="muted mb-8" data-i18n="iosOther"></p>
      <button class="btn block" id="copyBtn" data-i18n="copyLink"></button>
    </section>

    <!-- Android without the one-tap prompt (e.g. Firefox, Samsung Internet) -->
    <section class="platform card" id="p-android">
      <h2 class="bold mb-8" data-i18n="androidTitle"></h2>
      <ol class="steps-list">
        <li><span data-i18n="android1"></span></li>
        <li><span data-i18n="android2"></span></li>
      </ol>
    </section>

    <!-- Desktop -->
    <section class="platform card" id="p-desktop">
      <h2 class="bold mb-8" data-i18n="desktopTitle"></h2>
      <p class="muted" data-i18n="desktopText"></p>
      <div class="copy-box mt-12"><code id="url" dir="ltr"></code><button class="btn small" id="copyBtn2" data-i18n="copy"></button></div>
      <p class="faint small mt-12" data-i18n="desktopNote"></p>
    </section>

    <div class="feat">
      <div><b data-i18n="f1t"></b><span data-i18n="f1"></span></div>
      <div><b data-i18n="f2t"></b><span data-i18n="f2"></span></div>
      <div><b data-i18n="f3t"></b><span data-i18n="f3"></span></div>
      <div><b data-i18n="f4t"></b><span data-i18n="f4"></span></div>
    </div>
    <p class="center mt-24"><a href="./#/today" data-i18n="continue"></a></p>
    <div class="langs" id="langs"></div>
  </main>

      var T = {

          copyLink: 'Copy link', copy: 'Copy', copied: 'Copied ✓',

          androidTitle: 'Auf Android installieren', android1: 'Öffne das Browsermenü <b>⋮</b>.', android2: 'Tippe auf <b>App installieren</b> oder <b>Zum Startbildschirm hinzufügen</b>.',
          desktopTitle: 'Auf dem Handy öffnen', desktopText: 'Daily Companion ist für dein Handy gemacht. Öffne diese Adresse dort:',
          desktopNote: 'Am Computer kannst du sie auch über das Installieren-Symbol in der Adressleiste installieren oder einfach <a href="./#/today">im Browser öffnen</a>.',

          f2t: '💬 Coach', f2: 'Kurze, ehrliche Nachrichten im richtigen Moment.',
          f3t: '⚡ Quests', f3: 'XP, Level und Serien.',
          f4t: '📴 Offline', f4: 'Funktioniert ohne Netz und synchronisiert später.',
          continue: 'Im Browser weiter →' },
        ru: { name: 'Русский', title: 'Установить Daily Companion',
          lead: 'Твой личный тренер: план на день, квесты, еда, тренировки, сон и честные чек-ины.',
          installed: 'Ты используешь установленное приложение.', open: 'Открыть Daily Companion',
          installBtn: '⬇︎ Установить', installNote: 'Добавляется на главный экран. Бесплатно, без магазина приложений.',
          iosTitle: 'Установка на iPhone',
          ios1: 'Нажми кнопку <b>Поделиться</b> {share} внизу Safari (на iPad — вверху).',

          ios3: 'Нажми <b>Добавить</b>. Потом открой <b>Companion</b> с экрана «Домой» — уведомления работают только там.',
          iosNote: 'Для уведомлений нужна iOS 16.4 или новее.',
          iosOther: 'Проще всего в <b>Safari</b>: скопируй ссылку на эту страницу, открой её в Safari и следуй шагам. (В новых версиях Chrome пункт <b>На экран «Домой»</b> тоже есть в меню «Поделиться».)',
          copyLink: 'Копировать ссылку', copy: 'Копировать', copied: 'Скопировано ✓',
          androidTitle: 'Установка на Android', android1: 'Открой меню браузера <b>⋮</b>.', android2: 'Нажми <b>Установить приложение</b> или <b>Добавить на главный экран</b>.',
          desktopTitle: 'Открой на телефоне', desktopText: 'Daily Companion создан для телефона. Открой на нём этот адрес:',
          desktopNote: 'На компьютере можно установить через значок установки в адресной строке или просто <a href="./#/today">открыть в браузере</a>.',
          f1t: '📅 План на день', f1: 'Под короткие и длинные дни и экзамены.',
          f2t: '💬 Тренер', f2: 'Короткие честные сообщения в нужный момент.',
          f3t: '⚡ Квесты', f3: 'XP, уровни и серии.',
          f4t: '📴 Офлайн', f4: 'Работает без сети, синхронизирует позже.',
          continue: 'Продолжить в браузере →' },
        zh: { name: '中文', title: '安装 Daily Companion',
          lead: '你的私人教练：每日计划、任务、饮食、训练、睡眠和真实的打卡。',
          installed: '你正在使用已安装的应用。', open: '打开 Daily Companion',
          installBtn: '⬇︎ 安装应用', installNote: '添加到主屏幕。免费，无需应用商店。',
          iosTitle: '在 iPhone 上安装',
          ios1: '点击 Safari 底部的<b>分享</b>按钮 {share}（iPad 在顶部）。',
          ios2: '向下滑动，点击<b>添加到主屏幕</b>。',
          ios3: '点击<b>添加</b>。然后从主屏幕打开 <b>Companion</b>——只有这样才能收到通知。',
          iosNote: '通知需要 iOS 16.4 或更高版本。',
          iosOther: '用 <b>Safari</b> 最方便：复制本页链接，在 Safari 中打开，然后按步骤操作。（新版 Chrome 的分享菜单中也有<b>添加到主屏幕</b>。）',
          copyLink: '复制链接', copy: '复制', copied: '已复制 ✓',
          androidTitle: '在 Android 上安装', android1: '打开浏览器菜单 <b>⋮</b>。', android2: '点击<b>安装应用</b>或<b>添加到主屏幕</b>。',
          desktopTitle: '在手机上打开', desktopText: 'Daily Companion 是为手机设计的。请在手机上打开这个地址：',
          desktopNote: '在电脑上也可以通过地址栏的安装图标安装，或者直接<a href="./#/today">在浏览器中打开</a>。',
          f1t: '📅 每日计划', f1: '根据短课日、长课日和考试安排。',
          f2t: '💬 教练', f2: '在合适的时候发来简短、真实的消息。',
          f3t: '⚡ 任务', f3: '经验值、等级和连续天数。',
          f4t: '📴 离线可用', f4: '没有信号也能用，之后再同步。',
          continue: '在浏览器中继续 →' },
        ar: { name: 'العربية', title: 'تثبيت Daily Companion',
          lead: 'مدرّبك الشخصي: خطة يومية، مهام، طعام، تمارين، نوم، وتسجيل يومي صادق.',
          installed: 'أنت تستخدم التطبيق المثبّت.', open: 'افتح Daily Companion',
          installBtn: '⬇︎ تثبيت التطبيق', installNote: 'يُضاف إلى شاشتك الرئيسية. مجاني ودون متجر تطبيقات.',
          iosTitle: 'التثبيت على iPhone',
          ios1: 'اضغط زر <b>المشاركة</b> {share} أسفل Safari (أعلى الشاشة في iPad).',
          ios2: 'مرّر للأسفل واضغط <b>إضافة إلى الشاشة الرئيسية</b>.',
          ios3: 'اضغط <b>إضافة</b>. ثم افتح <b>Companion</b> من الشاشة الرئيسية — الإشعارات تعمل من هناك فقط.',
          iosNote: 'تتطلب الإشعارات iOS 16.4 أو أحدث.',
          iosOther: 'الأسهل في <b>Safari</b>: انسخ رابط هذه الصفحة وافتحه في Safari ثم اتبع الخطوات. (الإصدارات الحديثة من Chrome فيها أيضًا <b>إضافة إلى الشاشة الرئيسية</b> في قائمة المشاركة.)',
          copyLink: 'نسخ الرابط', copy: 'نسخ', copied: 'تم النسخ ✓',
          androidTitle: 'التثبيت على Android', android1: 'افتح قائمة المتصفح <b>⋮</b>.', android2: 'اضغط <b>تثبيت التطبيق</b> أو <b>إضافة إلى الشاشة الرئيسية</b>.',
          desktopTitle: 'افتحه على هاتفك', desktopText: 'صُمّم Daily Companion للهاتف. افتح هذا العنوان عليه:',
          desktopNote: 'على الكمبيوتر يمكنك أيضًا تثبيته من أيقونة التثبيت في شريط العنوان، أو ببساطة <a href="./#/today">فتحه في المتصفح</a>.',
          f1t: '📅 خطة يومية', f1: 'مبنية حول الأيام القصيرة والطويلة والامتحانات.',
          f2t: '💬 المدرّب', f2: 'رسائل قصيرة وصادقة في الوقت المناسب.',
          f3t: '⚡ المهام', f3: 'نقاط خبرة ومستويات وسلاسل.',
          f4t: '📴 دون اتصال', f4: 'يعمل دون إشارة ويزامن لاحقًا.',
          continue: 'المتابعة في المتصفح ←' },
      };

      // Language: the app's choice, else the phone's language, else English.
      var lang = 'en';
      try { lang = localStorage.getItem('dc.lang') || ''; } catch (e) {}
      if (!T[lang]) lang = ((navigator.languages || [navigator.language || 'en'])[0] || 'en').slice(0, 2).toLowerCase();
      if (!T[lang]) lang = 'en';

      function apply(code) {
        lang = T[code] ? code : 'en';
        var d = T[lang];
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.title = d.title;
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var v = d[el.getAttribute('data-i18n')] || T.en[el.getAttribute('data-i18n')] || '';
          el.innerHTML = v.replace('{share}', SHARE);
        });
        document.querySelectorAll('#langs button').forEach(function (b) { b.classList.toggle('on', b.dataset.code === lang); });
      }
      var langs = document.getElementById('langs');
      Object.keys(T).forEach(function (code) {
        var b = document.createElement('button');
        b.textContent = T[code].name;
        b.dataset.code = code;
        b.addEventListener('click', function () {
          try { localStorage.setItem('dc.lang', code); } catch (e) {}
          apply(code);
        });
        langs.appendChild(b);
      });
      apply(lang);

      // ---- Which install instructions to show ------------------------------------
      var ua = navigator.userAgent;
      var iOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var android = /Android/.test(ua);
      var iosSafari = iOS && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA/.test(ua);
      var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      var deferred = null;
      function show(id) {
        document.querySelectorAll('.platform').forEach(function (el) { el.classList.toggle('show', el.id === id); });
      }
      function fallback() {
        if (standalone) return show('p-installed');
        if (iOS) return show(iosSafari ? 'p-ios' : 'p-ios-other');
        if (android) return show('p-android');
        show('p-desktop');
      }
      fallback();
      document.getElementById('url').textContent = location.origin + '/download';

      // Chrome/Edge (Android + desktop): real one-tap install.
      addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        if (!standalone) show('p-onetap');
      });
      addEventListener('appinstalled', function () { show('p-installed'); });
      document.getElementById('installBtn').addEventListener('click', function () {
        if (!deferred) return fallback();
        deferred.prompt();
        deferred.userChoice.then(function (c) { deferred = null; if (c.outcome !== 'accepted') fallback(); });
      });
      function copy(btn) {
        var link = location.origin + '/download';
        (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(function () {
          btn.textContent = T[lang].copied;
        }, function () { prompt(T[lang].copyLink, link); });
      }
      document.getElementById('copyBtn').addEventListener('click', function () { copy(this); });
      document.getElementById('copyBtn2').addEventListener('click', function () { copy(this); });

      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
    })();

</body>
</html>
