<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05060b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="AI Worker Factory — a visual command centre for AI projects." />
  <title>Worker Factory</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/app.css" />
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <!-- 3D world (canvas + floating labels are added by world/scene.js) -->
  <div id="world" class="world" aria-label="Factory world: drag to rotate, scroll to zoom, click a cloud to open it"></div>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand"><span class="brand-mark"></span><span>Worker Factory</span></div>
    <div class="top-actions">
      <button id="status-pill" class="pill" title="Connection"><span class="dot"></span><span class="label">Connecting…</span></button>
      <button id="activity-btn" class="pill" title="Live tasks"><span class="dot"></span><span class="label">Idle</span></button>
      <button id="spend-pill" class="pill hide-sm" title="Spending today"></button>
      <button id="approvals-btn" class="icon-btn" title="Approvals"><span data-icon="bell"></span><span class="badge hidden"></span></button>
      <button id="settings-btn" class="icon-btn" title="Settings"><span data-icon="settings"></span></button>
    </div>
  </header>

  <button id="back-btn" class="back-btn hidden"><span data-icon="back"></span>World</button>
  <p id="hint" class="hint">Drag to rotate · scroll to zoom · right-drag to pan · click a cloud</p>

  <!-- Cloud detail panel -->
  <aside id="panel" class="panel hidden" aria-live="polite"></aside>

  <!-- Drawers -->
  <section id="activity" class="drawer hidden" aria-label="Live tasks"></section>
  <section id="approvals" class="drawer hidden" aria-label="Approvals"></section>

  <!-- Chat -->
  <div id="chat" class="chat">
    <div id="chat-log" class="chat-log hidden"></div>
    <form id="chat-form" class="composer">
      <button type="button" id="chat-toggle" class="icon-btn ghost" title="Show conversation"><span data-icon="chat"></span></button>
      <textarea id="chat-input" rows="1" placeholder="Ask your factory…" autocomplete="off"></textarea>
      <button type="submit" id="chat-send" class="send-btn" title="Send"><span data-icon="send"></span></button>
    </form>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toasts" class="toasts"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
